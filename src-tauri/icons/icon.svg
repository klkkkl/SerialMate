<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- 主渐变 - 深邃科技感 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    
    <!-- 霓虹青色渐变 -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00fff5"/>
      <stop offset="100%" style="stop-color:#00d4aa"/>
    </linearGradient>
    
    <!-- 紫色渐变 -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    
    <!-- 橙色渐变 -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#eab308"/>
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="url(#bgGrad)"/>
  
  <!-- 外框装饰线 -->
  <rect x="48" y="48" width="416" height="416" rx="68" ry="68" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- 终端窗口外框 -->
  <g filter="url(#glow)">
    <rect x="80" y="100" width="352" height="280" rx="16" ry="16" fill="rgba(255,255,255,0.05)" stroke="url(#cyanGrad)" stroke-width="3"/>
    
    <!-- 终端顶栏 -->
    <rect x="80" y="100" width="352" height="36" rx="16" ry="16" fill="rgba(0,255,245,0.1)"/>
    <rect x="80" y="120" width="352" height="16" fill="rgba(0,255,245,0.1)"/>
    
    <!-- 窗口控制按钮 -->
    <circle cx="105" cy="118" r="8" fill="#ff5f57"/>
    <circle cx="130" cy="118" r="8" fill="#ffbd2e"/>
    <circle cx="155" cy="118" r="8" fill="#28ca42"/>
  </g>
  
  <!-- 数据流 - 二进制代码行 -->
  <g filter="url(#glow)" font-family="Monaco, Consolas, monospace" font-size="18" font-weight="bold">
    <!-- 第一行 - 青色 -->
    <text x="100" y="175" fill="#00fff5" opacity="0.9">01001101 01000001</text>
    
    <!-- 第二行 - 紫色 -->
    <text x="100" y="205" fill="#a855f7" opacity="0.85">TX: 0xFF 0x01 0x02</text>
    
    <!-- 第三行 - 橙色 -->
    <text x="100" y="235" fill="#f97316" opacity="0.8">RX: 0x00 0xAA 0x55</text>
    
    <!-- 第四行 - 绿色 -->
    <text x="100" y="265" fill="#22c55e" opacity="0.75">&gt;_ connected...</text>
  </g>
  
  <!-- 连接状态指示器 -->
  <g transform="translate(360, 165)" filter="url(#glowStrong)">
    <!-- 连接符号 - 双向箭头 -->
    <circle cx="0" cy="0" r="28" fill="rgba(34,197,94,0.2)" stroke="#22c55e" stroke-width="2"/>
    <path d="M-12,-8 L0,-8 L0,-14 L14,0 L0,14 L0,8 L-12,8 Z" fill="#22c55e"/>
    <circle cx="0" cy="0" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- 数据波形 - 底部 -->
  <g transform="translate(100, 320)" filter="url(#glow)">
    <path d="M0,20 L20,20 L20,0 L40,0 L40,20 L50,20 L50,0 L70,0 L70,20 L80,20 L80,0 L100,0 L100,20 L110,20 L110,0 L130,0 L130,20 L150,20 L150,0 L170,0 L170,20 L180,20 L180,0 L200,0 L200,20 L220,20 L220,0 L240,0 L240,20 L260,20" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- 调试符号 - 左下角虫子图标 -->
  <g transform="translate(95, 405)" filter="url(#glow)">
    <!-- Bug 图标 -->
    <ellipse cx="20" cy="15" rx="14" ry="10" fill="none" stroke="#f97316" stroke-width="2.5"/>
    <line x1="6" y1="8" x2="0" y2="2" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="34" y1="8" x2="40" y2="2" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6" y1="15" x2="-2" y2="15" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="34" y1="15" x2="42" y2="15" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="6" y1="22" x2="0" y2="28" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="34" y1="22" x2="40" y2="28" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <text x="52" y="20" fill="#f97316" font-family="Monaco, monospace" font-size="14" font-weight="bold">DEBUG</text>
  </g>
  
  <!-- 连接插头符号 - 右下角 -->
  <g transform="translate(320, 395)" filter="url(#glow)">
    <!-- USB/串口插头抽象 -->
    <rect x="0" y="5" width="40" height="20" rx="4" fill="none" stroke="#a855f7" stroke-width="2.5"/>
    <rect x="40" y="8" width="12" height="14" rx="2" fill="none" stroke="#a855f7" stroke-width="2.5"/>
    <line x1="52" y1="15" x2="70" y2="15" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4,3"/>
    <!-- 连接点 -->
    <circle cx="10" cy="15" r="3" fill="#a855f7"/>
    <circle cx="20" cy="15" r="3" fill="#a855f7"/>
    <circle cx="30" cy="15" r="3" fill="#a855f7"/>
    <text x="75" y="20" fill="#a855f7" font-family="Monaco, monospace" font-size="14" font-weight="bold">LINK</text>
  </g>
  
  <!-- 装饰性数据点 -->
  <g fill="#00fff5" opacity="0.6">
    <circle cx="420" cy="260" r="3"/>
    <circle cx="410" cy="280" r="2"/>
    <circle cx="425" cy="300" r="2.5"/>
    <circle cx="415" cy="320" r="2"/>
  </g>
  
  <!-- 角落装饰 -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none">
    <path d="M60,80 L60,60 L80,60"/>
    <path d="M452,80 L452,60 L432,60"/>
    <path d="M60,432 L60,452 L80,452"/>
    <path d="M452,432 L452,452 L432,452"/>
  </g>
</svg>
